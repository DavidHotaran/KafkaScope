[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Hotaran" }
]
requires-python = ">=3.14"
dependencies = [
    "confluent-kafka>=2.15.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.52.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
[tool.ruff]
line-length = 88
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # flake8-bugbear (common bug patterns)
]
ignore = [
    "E203",  # whitespace before ':' (formatter handles this)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
